<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 12px 14px; font: 13px system-ui, sans-serif; width: 220px; }
  label { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  input { appearance: none; position: relative; width: 36px; height: 20px; margin: 0;
          border-radius: 10px; background: #bbb; cursor: pointer; transition: background .15s; }
  input::after { content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px;
                 border-radius: 50%; background: #fff; transition: left .15s; }
  input:checked { background: #1a73e8; }
  input:checked::after { left: 18px; }
  #note { margin: 8px 0 0; color: #666; font-size: 11px; }
</style>
</head>
<body>
  <label>GPU Keepalive<input type="checkbox" id="enabled" disabled></label>
  <script src="popup.js"></script>
</body>
</html>
